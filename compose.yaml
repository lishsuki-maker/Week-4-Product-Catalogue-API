services:
  catalogue-web:
    image: nginx:1.26.2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./index.html:/usr/share/nginx/html/index.html
    depends_on:
      inventory-api:
        condition: service_healthy    
    networks:
      - frontend
  inventory-api:
    build: .
    environment:
      DB_HOST: inventory-db
    env_file:
      - .env   
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:  
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/dbcheck || exit 1"]
    networks:
      - frontend
      - backend
  inventory-db:
    image: postgres:16-alpine
    env_file:
      - .env
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - backend
networks:
  frontend:
  backend:
volumes:  
  inventory-db-data:
